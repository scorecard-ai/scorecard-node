# This workflow publishes the package to NPM.
# You can run this workflow manually by navigating to https://www.github.com/scorecard-ai/scorecard-node/actions/workflows/publish-npm.yml
name: Publish NPM
on:
  workflow_dispatch:
    inputs:
      path:
        description: "Package to publish: '.' or 'packages/mcp-server'. Leave empty to publish both. Versions already on npm are skipped, so re-running is safe."
        required: false
        default: ''

  release:
    types: [published]

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # required for npm trusted publishing (OIDC)

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version: '24'

      - name: Update npm
        # Trusted publishing requires npm >= 11.5.1 (pnpm publish shells out to npm).
        # Pinned to 11.x: npm 12 refuses remote tarball deps (jq-web) used by the MCP bundle build.
        run: npm install -g npm@11

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Install dependencies
        run: |
          pnpm install

      - name: Publish to NPM
        run: |
          if [ -n "$INPUT_PATH" ]; then
            PATHS_RELEASED="[\\\"$INPUT_PATH\\\"]"
          else
            PATHS_RELEASED='[\".\", \"packages/mcp-server\"]'
          fi
          pnpm tsn scripts/publish-packages.ts "{ \"paths_released\": \"$PATHS_RELEASED\" }"
        env:
          INPUT_PATH: ${{ github.event.inputs.path }}

      - name: Upload MCP Server bundle GitHub release asset
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            TAG="$RELEASE_TAG"
          else
            # Manual run: attach to the release matching the current version, if it exists
            TAG="v$(jq -r .version package.json)"
            if ! gh release view "$TAG" > /dev/null 2>&1; then
              echo "No GitHub release $TAG found; skipping bundle upload"
              exit 0
            fi
          fi
          gh release upload "$TAG" packages/mcp-server/scorecard_ai_api.mcpb --clobber
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
